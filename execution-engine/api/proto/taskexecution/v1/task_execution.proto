// 用例下发控制面接口。
//
// Python Web 负责业务入口，并通过 gRPC 调用 Go execution-engine。引擎负责
// 查询用例、持久化执行记录并向 RabbitMQ 批量投递任务；执行机消费任务后，
// 仍然回调 Python Web 更新最终状态。本协议只描述下发能力，不接管完整的
// 用例执行状态机。
syntax = "proto3";

package taskexecution.v1;

option go_package = "execution-engine/api/gen/taskexecution/v1;taskexecutionv1";

service TaskExecutionService {
  // 单用例下发：创建执行记录、发布 MQ，并回写 WAIT/FAILED 状态。
  rpc ExecuteCase(ExecuteCaseRequest) returns (ExecuteCaseResponse);

  // 按 BATCH_SIZE 分片下发指定版本的全部用例；每完成一个分片返回一帧进度。
  // 多个 worker goroutine 并行处理，因此进度帧不保证按分片编号到达。
  rpc ExecuteAllCases(ExecuteAllCasesRequest) returns (stream BatchDispatchProgress);

  // 下发指定渠道和版本的用例，流式返回语义与全量下发相同。
  rpc ExecuteChannelCases(ExecuteChannelCasesRequest) returns (stream BatchDispatchProgress);
}

// DispatchStatus 只表示“下发结果”，不表示用例最终执行结果。WAIT 表示消息已
// 成功发布并收到确认，FAILED 表示下发失败。SUCCESS/FAILED 等执行机结果仍
// 由执行机回调 Python Web 写入，不属于本引擎职责。
enum DispatchStatus {
  DISPATCH_STATUS_UNSPECIFIED = 0;
  DISPATCH_STATUS_WAIT        = 1;
  DISPATCH_STATUS_FAILED      = 2;
}

message ExecuteCaseRequest {
  int64  case_id = 1;
  string version = 2;
  string user    = 3;

  // 幂等请求标识；客户端重试同一次下发时必须复用。
  string request_id = 4;
}

message ExecuteCaseResponse {
  int64          execution_id = 1;
  DispatchStatus status       = 2;
  string         request_id   = 3;
}

message ExecuteAllCasesRequest {
  string version = 1;
  string user    = 2;

  // 幂等请求标识；客户端重试同一次下发时必须复用。
  string request_id = 3;
}

message ExecuteChannelCasesRequest {
  string channel = 1;
  string version = 2;
  string user    = 3;

  // 幂等请求标识；客户端重试同一次下发时必须复用。
  string request_id = 4;
}

// 分片进度帧；服务端每完成一个分片发送一帧。
message BatchDispatchProgress {
  // 生产者从游标切分数据时分配的编号；到达顺序不保证等于该编号顺序。
  int32 chunk_index = 1;

  // 当前分片计划下发的用例数。
  int32 chunk_size = 2;

  // 已收到 MQ 发布确认的执行记录 ID。
  repeated int64 success_execution_ids = 3;

  // MQ 发布失败的执行记录 ID，包括 nack、超时和 channel 异常。
  repeated int64 failed_execution_ids = 4;

  // 当前已经成功下发的执行记录累计数。
  int32 total_dispatched = 5;

  // 计划下发总数，在流式处理开始前通过 COUNT(*) 计算一次。
  int32 total_planned = 6;

  // 分片整体异常信息，例如数据库事务错误，或尚未收到逐条确认时 MQ 连接断开。
  string chunk_error = 7;

  // 幂等请求标识；客户端重试时必须复用同一个值。
  string request_id = 8;
}

server:
  grpc_addr: ":9090"
  max_recv_msg_mb: 16

mysql:
  dsn: "root:root@tcp(127.0.0.1:3306)/case_execution?parseTime=true&charset=utf8mb4&loc=Local"
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime_sec: 3600

rabbitmq:
  url: "amqp://guest:guest@127.0.0.1:5672/"
  exchange: "ut.exec"
  channel_pool: 8               # *amqp.Channel 池大小, 应 >= dispatch.worker_count
  confirm_timeout_ms: 5000
  reconnect_initial_backoff_ms: 1000   # 第一次重连等待时间
  reconnect_max_backoff_ms: 30000      # 最长重连等待时间 (指数退避上限)

dispatch:
  batch_size: 1000
  worker_count: 4

logger:
  level: "info"
  encoding: "console"
